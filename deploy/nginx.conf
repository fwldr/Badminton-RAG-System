# nginx 反代：/chat /kb/overview 等 API 转发到 api 服务；其余走前端静态 SPA
server {
    listen 80;
    server_name _;

    root /srv/web;
    index index.html;

    # 管理端上传（PDF/图片）上限；nginx 默认 1MB，超过会 413
    client_max_body_size 20m;

    # 后端 API 与健康检查
    location /auth { proxy_pass http://api:8000; }
    location /user { proxy_pass http://api:8000; proxy_read_timeout 120s; }
    location /uploads { proxy_pass http://api:8000; }
    location /chat { proxy_pass http://api:8000; proxy_read_timeout 120s; }
    location /ask { proxy_pass http://api:8000; }
    location /feedback { proxy_pass http://api:8000; }
    location /kb/overview { proxy_pass http://api:8000; }
    location /kb/catalog { proxy_pass http://api:8000; }
    location /admin { proxy_pass http://api:8000; }
    location /audit { proxy_pass http://api:8000; }
    location /health { proxy_pass http://api:8000; }

    # 前端静态资源 + SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
