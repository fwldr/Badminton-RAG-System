<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>羽问 · 我的</title>
<link rel="stylesheet" href="assets/prototype.css" />
</head>
<body>
  <div class="phone on-dark">
    <div class="me-head">
      <div class="statusbar"><span>9:41</span><span class="icons"><i></i><i></i><i></i><i></i>📶</span></div>
      <div class="lines"><i></i><i></i></div>
      <div class="navbar" style="color:#fff">我的<span class="left gear">⚙️</span></div>
      <div class="me-card rise">
        <div class="avatar me">🦾</div>
        <div class="info">
          <b>林小羽 <span class="lv">进阶</span></b>
          <span>主力拍：VICTOR 神速8000 · 4U · 28 磅</span>
        </div>
      </div>
      <div class="me-stats rise d1">
        <div class="s"><b>21</b><span>收藏</span></div>
        <div class="s"><b>4</b><span>动态</span></div>
        <div class="s"><b>2</b><span>纠错</span></div>
      </div>
    </div>

    <div class="me-body">
      <div class="pref-card rise d1">
        <div class="row">
          <div class="lbl"><b>回答语气</b><span>详细模式含更多背景与对比</span></div>
          <div class="seg" style="width:150px"><span>简洁</span><span class="on">详细</span></div>
        </div>
        <div class="row">
          <div class="lbl"><b>显示引用来源</b><span>气泡下方展开「引用来源」面板</span></div>
          <div class="switch on"></div>
        </div>
      </div>

      <div class="menu-card rise d2">
        <div class="item"><span class="ic">🔔</span><div class="tt"><b>消息通知</b><span>纠错审核结果·回复提醒</span></div><span class="badge amber">2 未读</span><span class="arrow">›</span></div>
        <div class="item"><span class="ic">✏️</span><div class="tt"><b>我的纠错</b><span>2 条 · 1 条已采纳</span></div><span class="arrow">›</span></div>
        <div class="item"><span class="ic">📄</span><div class="tt"><b>知识库入口</b><span>目录 · 热门 · 提交资料</span></div><span class="arrow">›</span></div>
        <div class="item"><span class="ic">⚙️</span><div class="tt"><b>设置</b><span>账号 · 隐私 · 清除缓存</span></div><span class="arrow">›</span></div>
        <div class="item" style="border-bottom:none"><span class="ic" style="background:#fef2f2">🚪</span><div class="tt"><b>退出登录</b></div><span class="arrow">›</span></div>
      </div>

      <p class="disclaimer rise d3">
        「羽问」内容基于公开资料整理，仅供学习参考，不构成医疗、训练或消费建议。<br />
        v0.9.0 · 备案信息 · 平台协议
      </p>
    </div>

    <div class="tabbar">
      <div class="tab"><span class="ic">🏸</span>提问</div>
      <div class="tab"><span class="ic">🧭</span>发现</div>
      <div class="tab"><span class="ic">🗂️</span>工作台</div>
      <div class="tab active"><span class="ic">👤</span>我的</div>
    </div>
  </div>
</body>
</html>
