# ============ badminton-rag 一键部署 ============
# 用法：docker compose up -d --build
# embedding 与生成 LLM 均走阿里云百炼（OpenAI 兼容 API），需在 .env 配置 LLM_API_KEY，
#   容器不再依赖本地 Ollama —— 首次启动：init(校验 key + 幂等入库) → api(ready) → web(8080)。
# 业务库默认走 MySQL（compose 自带 mysql 服务，随 up 一起起）；.env 可覆盖连接参数。
# 浏览器打开 http://localhost:8080 即可提问。

services:
  # MySQL 业务库（默认后端；数据卷 mysql-data 持久化）
  #   想临时回退到 SQLite 文件库：.env 设 DB_BACKEND=sqlite（仅建议本地试跑，勿用于生产）
  #   注意：本服务用 MYSQL_USER 建业务账号，.env 里 MYSQL_USER=root 时镜像会拒绝初始化；
  #         要用本机已有的 MySQL，就别起这个服务，直接在 .env 指 MYSQL_HOST=127.0.0.1 跑本地 api。
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql-root-password}
      MYSQL_DATABASE: ${MYSQL_DB:-badminton}
      MYSQL_USER: ${MYSQL_USER:-badminton}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-badminton-password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 60

  # 一次性初始化：校验百炼 key → 重建向量库（embedding 与生成都走百炼 API）
  init:
    build: .
    env_file: .env
    command:
      - sh
      - -c
      - |
        [ -n "$$LLM_API_KEY" ] || { echo "[init] 未配置 LLM_API_KEY（百炼），无法入库"; exit 1; }
        echo "[init] 开始入库 17 张 CSV（幂等）..."
        python -m app.ingest.pipeline
        echo "[init] 批量入库 data/raw_docs 文档（pdf/图片，幂等）..."
        python -m app.ingest.pipeline --only-docs
        echo "[init] 完成"
    environment:
      CHROMA_DIR: /app/data/chroma
      DB_BACKEND: ${DB_BACKEND:-mysql}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-badminton}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-badminton-password}
      MYSQL_DB: ${MYSQL_DB:-badminton}
    volumes:
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

  # API 服务
  api:
    build: .
    env_file: .env
    environment:
      CHROMA_DIR: /app/data/chroma
      DB_BACKEND: ${DB_BACKEND:-mysql}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-badminton}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-badminton-password}
      MYSQL_DB: ${MYSQL_DB:-badminton}
    volumes:
      - app-data:/app/data
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 15s

  # Web 前端 + 反代
  web:
    build: ./web
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # ===== 可选：自托管 Langfuse（默认不启用）=====
  # v4 需要 postgres + redis + minio + web 四件套，体积大；演示建议直接用 cloud（.env 里
  # LANGFUSE_BASE_URL=https://cloud.langfuse.com）。需要自托管时启用：
  #   docker compose --profile selfhost up -d
  # langfuse:
  #   profiles: ["selfhost"]
  #   image: langfuse/langfuse:latest
  #   environment:
  #     DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
  #     REDIS_URL: redis://redis:6379
  #     S3_ENDPOINT: http://minio:9000
  #     S3_ACCESS_KEY_ID: minioadmin
  #     S3_SECRET_ACCESS_KEY: minioadmin
  #     S3_BUCKET: langfuse
  #     S3_REGION: us-east-1
  #     NEXTAUTH_URL: http://localhost:3000
  #     NEXTAUTH_SECRET: change-me
  #     ENCRYPTION_KEY: change-me-32bytes
  #   ports: ["3000:3000"]
  #   depends_on: [postgres, redis, minio]
  # postgres:
  #   profiles: ["selfhost"]
